# nginx serves the built SPA and proxies the API, so the browser sees a single
# origin (http://localhost:8080).  That keeps the auth cookies first-party.
#
# It does NOT mean CORS is uninvolved: a browser sends `Origin` on every
# non-GET request, same-origin ones included, so the API still has to recognise
# its own origin.  `Host` is forwarded as `$http_host` rather than `$host`
# because `$host` strips the port, and the server compares `Origin` against
# `Host` to identify a same-origin request (see server/src/app.ts).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    # .woff2 is already compressed; gzipping it again only costs CPU.

    # --- Security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # The API sets its own CSP via helmet; this covers the static shell.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # --- API proxy ---------------------------------------------------------
    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        # Cookies must reach the browser unmodified (httpOnly, SameSite=Lax).
        proxy_pass_request_headers on;
    }

    # --- Hashed build assets, including the self-hosted .woff2 fonts -------
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Lesson media ------------------------------------------------------
    # The bundled sample video and its captions. These are unhashed public
    # files, so they get a day's cache rather than the immutable year given to
    # /assets/. nginx answers Range requests for them itself, which is what
    # lets the player seek without downloading the whole file.
    location ~ ^/(media|captions)/ {
        access_log off;
        # Pinned rather than left to mime.types: this image's copy has no
        # entry for .vtt, and a <track> served as application/octet-stream is
        # rejected by the browser, so the CC control would do nothing. The
        # nosniff header above makes the declared type the only one that counts.
        types {
            video/mp4 mp4;
            text/vtt  vtt;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
