# Cadence — prod-like stack.  From a clean clone:
#
#   cp .env.example .env && docker compose up --build
#   → http://localhost:8080
#
# Start order is enforced with health checks:
#   db (healthy) → migrate (completed) → server (healthy) → client

name: cadence

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadence_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cadence}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published only so host tools (psql, Prisma Studio) can reach it.
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Object storage for lesson videos and images.
  #
  # Behind the `storage` profile, so it does NOT start with a plain
  # `docker compose up`.  Two reasons:
  #
  #  * the default STORAGE_DRIVER is `local`, which needs no service at
  #    all — uploads work out of the box without it;
  #  * a machine that cannot pull the minio images (a restricted registry,
  #    a mirror, an offline build) would otherwise fail the whole `up` over
  #    a service the default configuration never touches.
  #
  # To use it:  STORAGE_DRIVER=s3 in .env, then
  #   docker compose --profile storage up --build
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: [storage]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cadence_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cadence_minio_password}
    volumes:
      - miniodata:/data
    ports:
      # API, then the web console for poking at the bucket by hand.
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot job: create the bucket the server expects.  MinIO has no
  # "create on first write", so without this the first upload would fail on
  # a clean volume.
  minio-bucket:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    profiles: [storage]
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${S3_ACCESS_KEY:-cadence_minio}' '${S3_SECRET_KEY:-cadence_minio_password}' &&
      mc mb --ignore-existing local/'${S3_BUCKET:-cadence-media}' &&
      echo 'Bucket ${S3_BUCKET:-cadence-media} ready'
      "

  # One-shot job: apply migrations, then run the idempotent seed.  Built from
  # the `builder` stage because that is the stage carrying the Prisma CLI and
  # tsx; the runtime image ships production dependencies only.
  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: builder
    working_dir: /app
    command: npm run db:deploy-and-seed -w server
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cadence}:${POSTGRES_PASSWORD:-cadence_dev_password}@db:5432/${POSTGRES_DB:-cadence}?schema=public
      # Set here, not left to .env: the SPA's public URL differs between the
      # host (Vite on :5173) and this stack (nginx on CLIENT_PORT), and every
      # value that differs is Compose's to supply.
      APP_URL: http://localhost:${CLIENT_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cadence}:${POSTGRES_PASSWORD:-cadence_dev_password}@db:5432/${POSTGRES_DB:-cadence}?schema=public
      # See the note on the migrate service: the SPA's public URL differs
      # between the host and this stack, so Compose owns it.
      APP_URL: http://localhost:${CLIENT_PORT:-8080}
      # Inside the network the endpoint is the service name, never
      # localhost — the same rule as DATABASE_URL.
      S3_ENDPOINT: http://minio:9000
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      # Uploads under the local driver.  A named volume, so they survive a
      # restart without being baked into the image.
      - mediadata:/app/storage
    # Exposed for direct API pokes and /api/docs; the browser uses :8080.
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Returns 200 only after a real `SELECT 1` against Postgres succeeds.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get({host:'127.0.0.1',port:4000,path:'/api/v1/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: runtime
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - '${CLIENT_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------
  # `test` profile — `npm run docker:test`
  # ----------------------------------------------------------------------

  # A disposable Postgres on tmpfs: fast, and it never shares the `pgdata`
  # volume, so running the tests cannot touch development data.
  db-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadence_dev_password}
      POSTGRES_DB: cadence_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d cadence_test']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  test-server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: builder
    profiles: [test]
    working_dir: /app
    command: npm run test -w server
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER:-cadence}:${POSTGRES_PASSWORD:-cadence_dev_password}@db-test:5432/cadence_test?schema=public
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER:-cadence}:${POSTGRES_PASSWORD:-cadence_dev_password}@db-test:5432/cadence_test?schema=public
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters-long
      COOKIE_SECURE: 'false'
      LOG_LEVEL: silent
      BCRYPT_COST: '4' # keep the suite fast; production uses 12
      # The suite writes real files through the real driver — no mocked
      # storage — into a tmpfs that disappears with the container.
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/cadence-test-storage
    tmpfs:
      - /tmp/cadence-test-storage
    depends_on:
      db-test:
        condition: service_healthy

  test-client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: builder
    profiles: [test]
    working_dir: /app
    command: npm run test -w client
    environment:
      NODE_ENV: test
      CI: 'true'

volumes:
  pgdata:
  miniodata:
  mediadata:
